services:
  - type: web
    name: home-budget-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: home-budget-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: home-budget-tracker-db
    plan: free
    databaseName: home_budget
    user: home_budget
