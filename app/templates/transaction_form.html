{% extends 'base.html' %}{% block content %}<h1>Edit transaction</h1><form method="post" class="form"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Date<input name="date" type="date" value="{{transaction.transaction_date}}" required></label><label>Type<select name="type">{% for kind in ['income','expense'] %}<option value="{{kind}}" {% if transaction.kind==kind %}selected{% endif %}>{{kind}}</option>{% endfor %}</select></label><label>Category<select name="category_id">{% for c in categories %}<option value="{{c.id}}" {% if c.id==transaction.category_id %}selected{% endif %}>{{c.kind}} — {{c.name}}</option>{% endfor %}</select></label><label>Amount<input name="amount" type="number" step="0.01" min="0.01" value="{{transaction.amount}}" required></label><label>Description<input name="description" value="{{transaction.description}}" required></label><label>Payment method<input name="payment_method" value="{{transaction.payment_method or ''}}"></label><button>Save changes</button></form>{% endblock %}
