{% extends 'base.html' %}{% block content %}<h1>Edit monthly budget</h1><form method="post" class="form"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Expense category<select name="category_id">{% for c in categories %}<option value="{{c.id}}" {% if c.id==budget.category_id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></label><label>Month<input name="month" type="number" min="1" max="12" value="{{budget.month}}" required></label><label>Year<input name="year" type="number" min="2000" max="2100" value="{{budget.year}}" required></label><label>Amount<input name="amount" type="number" min="0.01" step="0.01" value="{{budget.amount}}" required></label><button>Save budget</button></form>{% endblock %}
