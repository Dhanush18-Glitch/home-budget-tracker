{% extends 'base.html' %}{% block content %}<h1>Categories</h1><div class="two-col"><section><h2>Add category</h2><form method="post" class="form"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Name<input name="name" maxlength="80" required></label><label>Type<select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></label><button>Add category</button></form></section><section><h2>Safe deletion</h2><p>Categories linked to transactions or budgets remain protected to preserve financial history.</p></section></div><table><thead><tr><th>Name</th><th>Type</th><th>Action</th></tr></thead><tbody>{% for c in categories %}<tr><td>{{c.name}}</td><td>{{c.kind}}</td><td><a href="{{url_for('web.edit_category',category_id=c.id)}}">Edit</a> <form class="inline" method="post" action="{{url_for('web.delete_category',category_id=c.id)}}" onsubmit="return confirm('Delete this unused category?')"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button class="link">Delete</button></form></td></tr>{% endfor %}</tbody></table>{% endblock %}
