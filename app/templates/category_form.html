{% extends 'base.html' %}{% block content %}<h1>Edit category</h1><form method="post" class="form"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Name<input name="name" maxlength="80" value="{{category.name}}" required></label><label>Type<select name="type"><option value="income" {% if category.kind=='income' %}selected{% endif %}>Income</option><option value="expense" {% if category.kind=='expense' %}selected{% endif %}>Expense</option></select></label><button>Save category</button></form>{% endblock %}
